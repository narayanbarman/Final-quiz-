<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<title>QuizCraft — Create Quizzes, Mock Tests & Short Videos</title>
<meta name="description" content="Create interactive quizzes, exam-style mock tests, and short videos in seconds. Free, interactive, and shareable." />
<meta name="theme-color" content="#6c5ce7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6c5ce7;--primary-dark:#5a4bd1;--primary-light:#a29bfe;
  --success:#00b894;--danger:#fd79a8;--warning:#fdcb6e;
  --bg:#f5f6fb;--card:#ffffff;--text:#1e293b;--text-secondary:#64748b;
  --border:#e2e8f0;--shadow:0 4px 24px rgba(108,92,231,.10);
  --radius:20px;--radius-sm:12px;--transition:.25s ease;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);line-height:1.5;padding:12px 10px}
.app-full{width:100%;max-width:680px;margin:0 auto}
.brand-header{display:flex;align-items:center;gap:12px;padding:10px 4px 18px;border-bottom:1px solid var(--border);margin-bottom:18px}
.brand-header .logo{display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:linear-gradient(135deg,var(--primary),#8b7cf7);border-radius:14px;color:#fff;font-size:1.3rem;box-shadow:0 6px 20px rgba(108,92,231,.28);flex-shrink:0}
.brand-header .brand-name{font-size:1.4rem;font-weight:800;color:var(--text);letter-spacing:-.5px}
.brand-header .brand-name span{color:var(--primary)}
.brand-header .brand-tagline{font-size:.7rem;font-weight:600;margin-left:auto;background:#eef0ff;color:var(--primary);padding:5px 12px;border-radius:60px;white-space:nowrap}
@media(max-width:480px){.brand-header .brand-tagline{display:none}}
.card{background:var(--card);border-radius:var(--radius);padding:20px 16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid rgba(108,92,231,.08)}
.btn{border:none;padding:10px 20px;border-radius:60px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#f1f3f5;color:var(--text);font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(108,92,231,.3)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:linear-gradient(135deg,var(--success),#00a381);color:#fff}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--text-secondary)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 14px;font-size:.75rem}
.btn-block{width:100%}
.input-group{margin:12px 0}
.input-label{font-size:.75rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block}
.input-field{width:100%;padding:11px 16px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:.9rem;font-family:inherit;background:#fafbff;color:var(--text)}
.input-field:focus{outline:none;border-color:var(--primary);background:#fff}
textarea.input-field{resize:vertical;min-height:90px}
.home-mode-btn{display:flex;align-items:center;padding:16px 14px;border-radius:16px;border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .2s ease;text-align:left;width:100%;margin-bottom:10px}
.home-mode-btn:hover{border-color:var(--primary-light);background:#fafbff;transform:translateY(-2px)}
.home-mode-btn .icon-wrap{font-size:1.5rem;margin-right:14px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:12px;flex-shrink:0}
.home-mode-btn .title{font-size:1rem;font-weight:800;color:var(--text)}
.home-mode-btn .subtitle{font-size:.76rem;font-weight:500;color:var(--text-secondary);margin-top:2px}
.option-row{background:#fafbff;border-radius:60px;padding:12px 18px;margin:8px 0;border:2px solid var(--border);cursor:pointer;transition:all var(--transition);font-weight:500;display:flex;align-items:center;gap:12px}
.option-row:hover{background:#f1f3ff;border-color:var(--primary-light)}
.option-row.correct-feedback{background:#e6f9f1!important;border-color:var(--success)!important;color:#065f46!important}
.option-row.wrong-feedback{background:#fde8ef!important;border-color:var(--danger)!important;color:#991b1b!important}
.option-number{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#e9ecf0;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;color:var(--text-secondary);flex-shrink:0}
.tab-bar{display:flex;gap:4px;background:#f1f3f5;border-radius:60px;padding:4px;margin-bottom:14px}
.tab-btn{border:none;padding:8px 16px;border-radius:60px;font-weight:600;font-size:.75rem;cursor:pointer;background:transparent;color:var(--text-secondary);flex:1;text-align:center}
.tab-btn.active{background:var(--card);color:var(--primary);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;padding:12px 22px;border-radius:60px;font-weight:600;font-size:.84rem;z-index:3000;opacity:0;transition:all .3s ease;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:linear-gradient(135deg,#059669,#10b981)}
.toast.error{background:linear-gradient(135deg,#e11d48,#f43f5e)}
.badge{background:#e0e7ff;color:var(--primary);padding:3px 10px;border-radius:40px;font-size:.7rem;font-weight:700}
.short-url-card{background:#f0fdf4;border:1.5px solid #a7f3d0;border-radius:14px;padding:14px;margin:12px 0;text-align:center}
</style>
</head>
<body>

<div class="app-full">
  <div class="brand-header">
    <div class="logo"><i class="fas fa-pen-fancy"></i></div>
    <div class="brand-name">Quiz<span>Craft</span></div>
    <span class="brand-tagline"><i class="fas fa-bolt"></i> Ready to Create &amp; Play</span>
  </div>

  <div id="toast" class="toast"></div>

  <!-- HOME SCREEN -->
  <div id="screenHome" class="card" style="text-align:center; padding:28px 18px;">
    <h2 style="font-size:1.4rem; font-weight:800; margin-bottom:6px;">Create or Play Quizzes</h2>
    <p style="color:var(--text-secondary); font-size:.85rem; margin-bottom:18px;">Select an option below to start immediately</p>

    <button class="home-mode-btn" onclick="startCreation('quiz')">
      <div class="icon-wrap">📝</div>
      <div>
        <div class="title">Interactive Quiz Mode</div>
        <div class="subtitle">Instant feedback per question • High engagement</div>
      </div>
    </button>

    <button class="home-mode-btn" onclick="startCreation('mock')">
      <div class="icon-wrap">⏱️</div>
      <div>
        <div class="title">Mock Test Mode</div>
        <div class="subtitle">All questions at once • Exam style review</div>
      </div>
    </button>

    <div style="margin-top:14px; background:#f8fafc; border:1px solid var(--border); border-radius:14px; padding:12px;">
      <p style="font-size:.78rem; font-weight:700; color:var(--text-secondary); margin-bottom:8px;">QUICK START WITH DEMO</p>
      <button class="btn btn-success btn-block" onclick="loadDemoQuiz()"><i class="fas fa-play"></i> Load &amp; Play Demo Quiz</button>
    </div>
  </div>

  <!-- CREATION SCREEN -->
  <div id="screenCreate" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="font-size:1.1rem; font-weight:800;">Create Quiz</h3>
      <span id="modeBadge" class="badge">QUIZ MODE</span>
    </div>

    <div class="input-group">
      <label class="input-label">Quiz Title</label>
      <input type="text" id="quizTitleInput" class="input-field" placeholder="e.g. Science Fundamentals" value="General Knowledge Challenge" />
    </div>

    <div class="input-group">
      <label class="input-label">Questions (CSV Format: Question, Option A, Option B, Option C, Option D, Correct Answer)</label>
      <textarea id="csvInput" class="input-field" rows="6" placeholder="What color is the sky?, Blue, Red, Green, Yellow, Blue"></textarea>
    </div>

    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn btn-outline" style="flex:1;" onclick="loadSampleCSV()">Insert Sample</button>
      <button class="btn btn-primary" style="flex:2;" onclick="buildQuizFromInput()"><i class="fas fa-check"></i> Generate Quiz</button>
    </div>
    <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="showScreen('screenHome')">Back to Home</button>
  </div>

  <!-- PLAYER & SHARE AREA -->
  <div id="screenPlayer" class="card" style="display:none;">
    <div class="tab-bar">
      <button id="tabPlayBtn" class="tab-btn active" onclick="switchTab('play')"><i class="fas fa-gamepad"></i> Play</button>
      <button id="tabShareBtn" class="tab-btn" onclick="switchTab('share')"><i class="fas fa-share-alt"></i> Share Short Link</button>
      <button class="tab-btn" onclick="showScreen('screenHome')"><i class="fas fa-home"></i> Home</button>
    </div>

    <!-- TAB: PLAY -->
    <div id="tabPlay" class="tab-panel active">
      <h3 id="displayQuizTitle" style="font-size:1.2rem; font-weight:800; margin-bottom:12px; text-align:center;"></h3>
      <div id="quizContainer"></div>
    </div>

    <!-- TAB: SHARE -->
    <div id="tabShare" class="tab-panel" style="padding:8px;">
      <div class="short-url-card">
        <h4 style="margin-bottom:4px; font-size:1.05rem; color:#065f46;"><i class="fas fa-bolt"></i> Clean Short Link Ready</h4>
        <p style="font-size:.78rem; color:#047857; margin-bottom:12px;">Compact link generated for easy sharing over WhatsApp and social media.</p>

        <input type="text" id="shareUrlBox" class="input-field" readonly style="text-align:center; font-weight:700; color:var(--primary); background:#fff; border-color:#a7f3d0; margin-bottom:12px;" />
        
        <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="copyShareUrl()"><i class="fas fa-copy"></i> Copy Short Link</button>
          <button class="btn btn-success" onclick="shareWhatsApp()"><i class="fab fa-whatsapp"></i> Share to WhatsApp</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentQuiz = null;
let currentQuestionIndex = 0;
let userAnswers = {};
let activeMode = 'quiz';

function showToast(msg, type = 'success') {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

function showScreen(id) {
  ['screenHome', 'screenCreate', 'screenPlayer'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
}

function startCreation(mode) {
  activeMode = mode;
  document.getElementById('modeBadge').textContent = mode.toUpperCase() + ' MODE';
  if (!document.getElementById('csvInput').value.trim()) {
    loadSampleCSV();
  }
  showScreen('screenCreate');
}

function loadSampleCSV() {
  const sample = 
`Which planet is known as the Red Planet?, Mars, Venus, Jupiter, Saturn, Mars
What is 8 + 5?, 11, 12, 13, 14, 13
What liquid do bees produce?, Milk, Honey, Water, Juice, Honey`;
  document.getElementById('csvInput').value = sample;
}

function parseCSV(rawText) {
  const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
  const questions = [];
  lines.forEach(line => {
    const parts = line.split(',').map(p => p.trim());
    if (parts.length >= 6) {
      questions.push({
        text: parts[0],
        options: [parts[1], parts[2], parts[3], parts[4]],
        correct: parts[5]
      });
    }
  });
  return questions;
}

// Compact compressor for super short URLs
function compressQuizData(quizObj) {
  try {
    const minified = {
      t: quizObj.title,
      m: quizObj.mode === 'quiz' ? 'q' : 'm',
      q: quizObj.questions.map(q => [q.text, q.options, q.correct])
    };
    return btoa(encodeURIComponent(JSON.stringify(minified))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  } catch(e) {
    return encodeURIComponent(JSON.stringify(quizObj));
  }
}

function decompressQuizData(compressedStr) {
  try {
    let base64 = compressedStr.replace(/-/g, '+').replace(/_/g, '/');
    while (base64.length % 4) base64 += '=';
    const jsonStr = decodeURIComponent(atob(base64));
    const parsed = JSON.parse(jsonStr);
    
    if (parsed.t && parsed.q) {
      return {
        id: Math.random().toString(36).substring(2, 8),
        title: parsed.t,
        mode: parsed.m === 'q' ? 'quiz' : 'mock',
        questions: parsed.q.map(q => ({
          text: q[0],
          options: q[1],
          correct: q[2]
        }))
      };
    }
    return parsed;
  } catch(e) {
    try {
      return JSON.parse(decodeURIComponent(compressedStr));
    } catch(err) {
      return null;
    }
  }
}

function buildQuizFromInput() {
  const title = document.getElementById('quizTitleInput').value.trim() || 'My Quiz';
  const rawCSV = document.getElementById('csvInput').value;
  const questions = parseCSV(rawCSV);

  if (questions.length === 0) {
    showToast('Please add at least 1 valid question!', 'error');
    return;
  }

  currentQuiz = {
    id: Math.random().toString(36).substring(2, 8),
    title: title,
    mode: activeMode,
    questions: questions
  };

  saveAndRenderQuiz();
}

function loadDemoQuiz() {
  activeMode = 'quiz';
  currentQuiz = {
    id: 'demo123',
    title: 'General Knowledge Demo',
    mode: 'quiz',
    questions: [
      { text: 'Which element has the chemical symbol O?', options: ['Gold', 'Oxygen', 'Osmium', 'Silver'], correct: 'Oxygen' },
      { text: 'How many legs does a spider have?', options: ['6', '8', '10', '12'], correct: '8' },
      { text: 'Capital city of France?', options: ['London', 'Berlin', 'Madrid', 'Paris'], correct: 'Paris' }
    ]
  };
  saveAndRenderQuiz();
}

function saveAndRenderQuiz() {
  currentQuestionIndex = 0;
  userAnswers = {};
  
  // Save short encoded link
  const compressed = compressQuizData(currentQuiz);
  const shareableUrl = `${window.location.origin}${window.location.pathname}?q=${compressed}`;
  document.getElementById('shareUrlBox').value = shareableUrl;

  document.getElementById('displayQuizTitle').textContent = currentQuiz.title;
  renderCurrentMode();
  showScreen('screenPlayer');
  switchTab('play');
  showToast('Quiz generated & ready!');
}

function switchTab(tab) {
  document.getElementById('tabPlay').classList.toggle('active', tab === 'play');
  document.getElementById('tabShare').classList.toggle('active', tab === 'share');
  document.getElementById('tabPlayBtn').classList.toggle('active', tab === 'play');
  document.getElementById('tabShareBtn').classList.toggle('active', tab === 'share');
}

function renderCurrentMode() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';

  if (currentQuiz.mode === 'quiz') {
    renderQuizStep(container);
  } else {
    renderMockTest(container);
  }
}

function renderQuizStep(container) {
  const q = currentQuiz.questions[currentQuestionIndex];
  const total = currentQuiz.questions.length;

  let html = `
    <div style="font-size:.8rem; font-weight:700; color:var(--text-secondary); margin-bottom:8px;">
      Question ${currentQuestionIndex + 1} of ${total}
    </div>
    <h4 style="font-size:1.1rem; font-weight:700; margin-bottom:14px;">${q.text}</h4>
  `;

  q.options.forEach((opt, idx) => {
    html += `
      <div class="option-row" id="opt-${idx}" onclick="selectQuizAnswer('${opt.replace(/'/g, "\\'")}', ${idx})">
        <span class="option-number">${String.fromCharCode(65 + idx)}</span>
        <span>${opt}</span>
      </div>
    `;
  });

  container.innerHTML = html;
}

function selectQuizAnswer(selected, idx) {
  const q = currentQuiz.questions[currentQuestionIndex];
  const optElements = document.querySelectorAll('.option-row');
  
  optElements.forEach(el => el.style.pointerEvents = 'none');

  if (selected.toLowerCase() === q.correct.toLowerCase()) {
    document.getElementById(`opt-${idx}`).classList.add('correct-feedback');
    showToast('Correct!', 'success');
  } else {
    document.getElementById(`opt-${idx}`).classList.add('wrong-feedback');
    showToast(`Incorrect. Correct: ${q.correct}`, 'error');
  }

  setTimeout(() => {
    if (currentQuestionIndex + 1 < currentQuiz.questions.length) {
      currentQuestionIndex++;
      renderCurrentMode();
    } else {
      showQuizCompletion();
    }
  }, 1400);
}

function renderMockTest(container) {
  let html = `<div style="display:flex; flex-direction:column; gap:16px;">`;
  
  currentQuiz.questions.forEach((q, qIdx) => {
    html += `
      <div style="background:#fafbff; border:1px solid var(--border); border-radius:14px; padding:14px;">
        <div style="font-weight:700; font-size:.95rem; margin-bottom:8px;">${qIdx + 1}. ${q.text}</div>
    `;

    q.options.forEach((opt, optIdx) => {
      const checked = userAnswers[qIdx] === opt ? 'checked' : '';
      html += `
        <label style="display:flex; align-items:center; gap:10px; margin:6px 0; cursor:pointer; font-size:.88rem;">
          <input type="radio" name="mock_q_${qIdx}" value="${opt.replace(/'/g, "\\'")}" ${checked} onchange="userAnswers[${qIdx}] = '${opt.replace(/'/g, "\\'")}'" />
          <span>${opt}</span>
        </label>
      `;
    });

    html += `</div>`;
  });

  html += `<button class="btn btn-success btn-block" style="margin-top:10px;" onclick="gradeMockTest()"><i class="fas fa-paper-plane"></i> Submit Test</button></div>`;
  container.innerHTML = html;
}

function gradeMockTest() {
  let score = 0;
  currentQuiz.questions.forEach((q, idx) => {
    if (userAnswers[idx] && userAnswers[idx].toLowerCase() === q.correct.toLowerCase()) {
      score++;
    }
  });

  const container = document.getElementById('quizContainer');
  container.innerHTML = `
    <div style="text-align:center; padding:20px;">
      <h3 style="font-size:1.5rem; font-weight:800; color:var(--primary);">Test Completed!</h3>
      <p style="font-size:1.1rem; font-weight:700; margin:12px 0;">Your Score: ${score} / ${currentQuiz.questions.length}</p>
      <button class="btn btn-primary" onclick="renderCurrentMode()"><i class="fas fa-redo"></i> Retake Test</button>
    </div>
  `;
}

function showQuizCompletion() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = `
    <div style="text-align:center; padding:20px;">
      <h3 style="font-size:1.4rem; font-weight:800; color:var(--primary);">Quiz Finished! 🎉</h3>
      <p style="font-size:.9rem; color:var(--text-secondary); margin:8px 0 16px;">Great job completing the quiz.</p>
      <button class="btn btn-primary" onclick="currentQuestionIndex=0; renderCurrentMode();"><i class="fas fa-redo"></i> Play Again</button>
    </div>
  `;
}

function copyShareUrl() {
  const box = document.getElementById('shareUrlBox');
  box.select();
  navigator.clipboard.writeText(box.value);
  showToast('Short link copied to clipboard!');
}

function shareWhatsApp() {
  const url = document.getElementById('shareUrlBox').value;
  const msg = `Play this Quiz: "${currentQuiz ? currentQuiz.title : 'Quiz'}"\n\nClick link to play:\n${url}`;
  window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
}

// Auto-Load Shared Quiz on Page Startup
window.addEventListener('load', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const queryParam = urlParams.get('q');
  
  if (queryParam) {
    const loaded = decompressQuizData(queryParam);
    if (loaded && loaded.questions && loaded.questions.length > 0) {
      currentQuiz = loaded;
      saveAndRenderQuiz();
      showToast('Shared quiz loaded!');
      return;
    }
  }

  // Fallback check hash if old link style used
  if (window.location.hash.includes('#quiz=')) {
    try {
      const raw = window.location.hash.split('#quiz=')[1];
      const parsed = decompressQuizData(raw);
      if (parsed && parsed.questions) {
        currentQuiz = parsed;
        saveAndRenderQuiz();
        showToast('Shared quiz loaded!');
      }
    } catch(e) {}
  }
});
</script>
</body>
</html>
